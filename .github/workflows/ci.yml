name: CI

# Runs on every pull request and push to main. Needs no cloud credentials:
# unit tests run offline and `dbt parse` compiles the project without a
# warehouse connection.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: pytest -q
      - name: Compile dbt project
        working-directory: transform
        env:
          DBT_PROFILES_DIR: .
        run: |
          cp profiles.example.yml profiles.yml
          dbt deps
          dbt parse
