name: Daily pipeline

# Ingest new data, then build and test the dbt project.
# Base transfers come from the Coinbase CDP SQL API (issue #10); a daily run
# uses one or two of its ~1,000 free monthly queries. EURC on Base is skipped
# (see ingest/base.py); DefiLlama still records its supply there.
# 11:17 UTC is 07:17 in Toronto (06:17 in winter); the odd minute avoids
# the top-of-hour queue on GitHub's shared runners.
on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:
    inputs:
      sources:
        description: "Sources to ingest (space-separated: ethereum base boc defillama, or all)"
        default: ethereum base boc defillama

permissions:
  contents: read
  id-token: write # lets the job exchange a GitHub OIDC token for short-lived GCP credentials

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GCP_PROJECT: crypto-504119
      # Base: CDP SQL API key for transfers; the decimals check uses
      # BASE_RPC_URL if set, else the public mainnet.base.org endpoint.
      CDP_API_KEY_ID: ${{ secrets.CDP_API_KEY_ID }}
      CDP_API_KEY_SECRET: ${{ secrets.CDP_API_KEY_SECRET }}
      BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # No service-account keys anywhere: Workload Identity Federation trusts
      # only this repository (see docs/gcp_setup.md).
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Ingest
        run: python -m ingest ${{ github.event.inputs.sources || 'ethereum base boc defillama' }}

      # Loads seeds, builds every model and runs every test against fresh data.
      # A broken model or a failing data test turns the daily run red.
      - name: Build and test dbt project
        if: ${{ !cancelled() }}
        working-directory: transform
        env:
          DBT_PROFILES_DIR: .
        run: |
          cp profiles.example.yml profiles.yml
          dbt deps
          dbt build
