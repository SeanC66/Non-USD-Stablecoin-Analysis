version: 2

models:
  - name: mart_daily_supply
    description: >
      One row per asset per day from the asset's first appearance through
      today: how much of each stablecoin exists, in its own currency and in CAD.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [supply_date, asset_symbol]
    columns:
      - name: supply_date
        description: Calendar day in UTC. The latest day can be carried forward from the day before.
        data_tests:
          - not_null
          - dbt_utils.sequential_values:
              arguments:
                interval: 1
                datepart: day
                group_by_columns: [asset_symbol]
      - name: eth_supply_onchain
        description: Circulating supply on Ethereum, for contracts that count toward supply. Running mints minus burns, less balances held by wallets in the supply_excluded_holders seed (JPYC's issuer treasury, see #11). Null for external assets (see #17).
      - name: eth_supply_defillama
        description: DefiLlama's Ethereum figure, for reconciliation. It reflects the close of the day before, so compare it with the prior day's eth_supply_onchain. Skipped days carry the last figure.
      - name: total_supply_defillama
        description: DefiLlama's figure summed across chains, each filled forward first. Null before the asset's first DefiLlama date.
      - name: onchain_supply_unlisted_chains
        description: Our own circulating supply, from transfers, on chains we load that DefiLlama doesn't list for the asset. Today that's XSGD on Base, from its first mint on 2025-09-18. Same supply rules as eth_supply_onchain. Null when there's no such chain or no DefiLlama total. mart_daily_chain_supply shows it per chain with supply_source onchain_transfers.
      - name: supply_native
        description: Headline supply in the asset's peg currency. total_supply_defillama plus onchain_supply_unlisted_chains when DefiLlama has the asset, otherwise eth_supply_onchain. Jumps on the day supply_source changes, which is not real growth.
        data_tests:
          - not_null
      - name: supply_source
        description: Which figure supply_native is showing. defillama_all_chains is DefiLlama's chains plus onchain_supply_unlisted_chains, if any. Adding an unlisted chain doesn't change the source, since its supply starts from its first mint.
        data_tests:
          - accepted_values:
              arguments:
                values: [defillama_all_chains, ethereum_onchain]
      - name: cad_per_unit
        description: Canadian dollars per unit of the peg currency. CAD is 1. Days without a published rate carry the last one.
        data_tests:
          - not_null
      - name: fx_is_stale
        description: True when the rate is more than 7 days old. Applies to RUB from 2026-05-08, so treat A7A5's supply_cad with caution.
        data_tests:
          - not_null
      - name: supply_cad
        description: supply_native in Canadian dollars.
        data_tests:
          - not_null

  - name: mart_daily_activity
    description: >
      One row per asset per day from the asset's first event through the latest
      complete UTC day on every chain: how much each stablecoin is used, not how
      much exists. Summed across every chain in int_token_transfers (Ethereum and
      Base today). Covers primary and legacy contracts. Days with no events have
      a row of zeros. Never includes a partial day: each chain counts through the
      day before its latest loaded day, so the mart ends at least a day before
      the run.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [activity_date, asset_symbol]
    columns:
      - name: activity_date
        description: Calendar day in UTC. The latest is a complete day, always before today.
        data_tests:
          - not_null
          - dbt_utils.sequential_values:
              arguments:
                interval: 1
                datepart: day
                group_by_columns: [asset_symbol]
      - name: is_pre_launch
        description: True before the asset's public_launch_date. Applies to CADD before 2026-05-04, so exclude these days when measuring adoption.
        data_tests:
          - not_null
      - name: transfers
        description: Transfers between wallets, including zero-value ones. Excludes mints and burns.
        data_tests:
          - not_null
      - name: mints
        description: Events from the zero address.
        data_tests:
          - not_null
      - name: burns
        description: Events to the zero address.
        data_tests:
          - not_null
      - name: active_addresses
        description: Distinct addresses that sent or received a transfer with a non-zero amount. Zero-value transfers are excluded as likely spam. Don't sum across days, since a wallet active on two days would count twice.
        data_tests:
          - not_null
      - name: senders
        description: Distinct addresses that sent a transfer with a non-zero amount.
        data_tests:
          - not_null
      - name: receivers
        description: Distinct addresses that received a transfer with a non-zero amount.
        data_tests:
          - not_null
      - name: transfer_volume_native
        description: Sum of transfer amounts in the asset's peg currency. Excludes mints and burns.
        data_tests:
          - not_null
      - name: largest_transfer_share
        description: Biggest single transfer divided by the day's volume, showing when one whale dominates a day. Null when the day has no volume.

  - name: mart_weekly_activity
    description: >
      One row per asset per week, Monday to Sunday, summed across every chain
      in int_token_transfers (Ethereum and Base today). Use this for weekly active
      addresses: the daily figure can't be summed. Ends on the same complete day
      as mart_daily_activity.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [activity_week, asset_symbol]
    columns:
      - name: activity_week
        description: The Monday the week starts on, in UTC.
        data_tests:
          - not_null
          - dbt_utils.sequential_values:
              arguments:
                interval: 1
                datepart: week
                group_by_columns: [asset_symbol]
      - name: days_in_week
        description: Complete days the mart covers in this week. Below 7 means a partial week, which is always the case for an asset's first week if it didn't start on a Monday, and for the latest week unless the last complete day is a Sunday. Filter on 7 for full weeks.
        data_tests:
          - not_null
      - name: is_pre_launch
        description: True when every day of the week is before the asset's public_launch_date. CADD launched on a Monday, so none of its weeks are split.
        data_tests:
          - not_null
      - name: transfers
        description: Transfers between wallets, including zero-value ones. Excludes mints and burns.
        data_tests:
          - not_null
      - name: active_addresses
        description: Distinct addresses that sent or received a transfer with a non-zero amount during the week.
        data_tests:
          - not_null
      - name: transfer_volume_native
        description: Sum of transfer amounts in the asset's peg currency. Excludes mints and burns.
        data_tests:
          - not_null

  - name: mart_daily_chain_supply
    description: >
      One row per asset, chain and day: where each stablecoin's supply sits, in
      its own currency and in CAD. Chains come from DefiLlama, plus any chain we
      load transfers for that DefiLlama doesn't list for the asset (XSGD on
      Base), filled from our own transfers. Each chain has one source, and
      chains sum to mart_daily_supply's supply_native. Assets DefiLlama doesn't
      list (BRZ, QCAD_LEGACY) have no rows.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [supply_date, asset_symbol, chain]
    columns:
      - name: supply_date
        description: Calendar day in UTC. Skipped days carry the last figure, and so can the latest day.
        data_tests:
          - not_null
      - name: chain
        description: Chain name as DefiLlama writes it, such as Ethereum or World Chain. Chains filled from our transfers are capitalised the same way, such as Base.
        data_tests:
          - not_null
      - name: supply_source
        description: Where this chain's figure comes from. defillama is DefiLlama's figure, with skipped days carrying the last one. onchain_transfers is our own supply from mints and burns, for a chain DefiLlama doesn't list for the asset; it follows the same rules as eth_supply_onchain.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [defillama, onchain_transfers]
      - name: supply_native
        description: Circulating supply on this chain in the asset's peg currency.
        data_tests:
          - not_null
      - name: cad_per_unit
        description: Canadian dollars per unit of the peg currency, from mart_daily_supply.
        data_tests:
          - not_null
      - name: fx_is_stale
        description: True when the rate is more than 7 days old. Applies to RUB from 2026-05-08, so treat A7A5's supply_cad with caution.
        data_tests:
          - not_null
      - name: supply_cad
        description: supply_native in Canadian dollars.
        data_tests:
          - not_null
