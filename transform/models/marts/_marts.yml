version: 2

models:
  - name: mart_daily_supply
    description: >
      One row per asset per day from the asset's first appearance through
      today: how much of each stablecoin exists, in its own currency and in CAD.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [supply_date, asset_symbol]
    columns:
      - name: supply_date
        description: Calendar day in UTC. The latest day can be carried forward from the day before.
        data_tests:
          - not_null
          - dbt_utils.sequential_values:
              arguments:
                interval: 1
                datepart: day
                group_by_columns: [asset_symbol]
      - name: eth_supply_onchain
        description: Running mints minus burns on Ethereum, for contracts that count toward supply. Null for external assets (see #17).
      - name: eth_supply_defillama
        description: DefiLlama's Ethereum figure, for reconciliation. It reflects the close of the day before, so compare it with the prior day's eth_supply_onchain. Skipped days carry the last figure.
      - name: total_supply_defillama
        description: DefiLlama's figure summed across chains, each filled forward first. Null before the asset's first DefiLlama date.
      - name: supply_native
        description: Headline supply in the asset's peg currency. Jumps on the day supply_source changes, which is not real growth.
        data_tests:
          - not_null
      - name: supply_source
        description: Which figure supply_native is showing.
        data_tests:
          - accepted_values:
              arguments:
                values: [defillama_all_chains, ethereum_onchain]
      - name: cad_per_unit
        description: Canadian dollars per unit of the peg currency. CAD is 1. Days without a published rate carry the last one.
        data_tests:
          - not_null
      - name: fx_is_stale
        description: True when the rate is more than 7 days old. Applies to RUB from 2026-05-08, so treat A7A5's supply_cad with caution.
        data_tests:
          - not_null
      - name: supply_cad
        description: supply_native in Canadian dollars.
        data_tests:
          - not_null

  - name: mart_daily_activity
    description: >
      One row per asset per day on Ethereum from the asset's first event through
      the latest day loaded: how much each stablecoin is used, not how much
      exists. Covers primary and legacy contracts. Days with no events have a
      row of zeros. The latest day is usually partial.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [activity_date, asset_symbol]
    columns:
      - name: activity_date
        description: Calendar day in UTC.
        data_tests:
          - not_null
          - dbt_utils.sequential_values:
              arguments:
                interval: 1
                datepart: day
                group_by_columns: [asset_symbol]
      - name: is_pre_launch
        description: True before the asset's public_launch_date. Applies to CADD before 2026-05-04, so exclude these days when measuring adoption.
        data_tests:
          - not_null
      - name: transfers
        description: Transfers between wallets, including zero-value ones. Excludes mints and burns.
        data_tests:
          - not_null
      - name: mints
        description: Events from the zero address.
        data_tests:
          - not_null
      - name: burns
        description: Events to the zero address.
        data_tests:
          - not_null
      - name: active_addresses
        description: Distinct addresses that sent or received a transfer with a non-zero amount. Zero-value transfers are excluded as likely spam. Don't sum across days, since a wallet active on two days would count twice.
        data_tests:
          - not_null
      - name: senders
        description: Distinct addresses that sent a transfer with a non-zero amount.
        data_tests:
          - not_null
      - name: receivers
        description: Distinct addresses that received a transfer with a non-zero amount.
        data_tests:
          - not_null
      - name: transfer_volume_native
        description: Sum of transfer amounts in the asset's peg currency. Excludes mints and burns.
        data_tests:
          - not_null
      - name: largest_transfer_share
        description: Biggest single transfer divided by the day's volume, showing when one whale dominates a day. Null when the day has no volume.
