version: 2

models:
  - name: int_token_transfers
    description: >
      One row per token transfer event on every chain we load, unioned from each
      chain's staging model into one shape. Marts read this, never a stg_*
      transfer model.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [chain, transaction_hash, log_index]
    columns:
      - name: chain
        description: Lower-case chain name, matching seeds/token_contracts.csv.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [ethereum, base, polygon, avalanche, arbitrum]
      - name: asset_symbol
        description: Null means the contract is missing from seeds/token_contracts.csv.
        data_tests:
          - not_null
      - name: amount
        description: Token amount scaled by the contract's decimals.
        data_tests:
          - not_null
      - name: transfer_type
        description: mint (from the zero address), burn (to the zero address) or transfer.
        data_tests:
          - accepted_values:
              arguments:
                values: [mint, burn, transfer]

  - name: int_transfer_addresses
    description: >
      One row per side (sender or receiver) of every transfer that counts as
      usage: primary and legacy contracts, wallet-to-wallet, non-zero amount.
      Ephemeral, shared by mart_daily_activity and mart_weekly_activity so both
      count addresses the same way.
    columns:
      - name: side
        description: sender or receiver.
      - name: address
        description: The wallet on that side of the transfer.

  - name: int_onchain_daily_supply
    description: >
      One row per chain, asset and day, from the asset's first supply event on
      that chain through today: circulating supply rebuilt from our own
      transfers. Applies the supply rules once for every chain: only contracts
      that count toward supply, never external assets (see #17), and wallets in
      the supply_excluded_holders seed treated like the zero address (see #11).
      mart_daily_supply reads the Ethereum rows for eth_supply_onchain, and both
      supply marts use the rows DefiLlama doesn't cover.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [chain, asset_symbol, supply_date]
    columns:
      - name: chain
        description: Lower-case chain name, matching seeds/token_contracts.csv.
        data_tests:
          - not_null
      - name: circulating
        description: Running net issuance into circulation, in the asset's peg currency.
        data_tests:
          - not_null
      - name: defillama_lists_chain
        description: True when DefiLlama reports this chain for the asset on any day. Only chains where it's false fill DefiLlama's gaps, so no chain is counted from both sources. False today for XSGD on Base, and for assets DefiLlama doesn't list at all (BRZ, QCAD_LEGACY), which the marts leave on Ethereum alone.
        data_tests:
          - not_null
