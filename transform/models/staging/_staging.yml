version: 2

models:
  - name: stg_ethereum__token_transfers
    description: >
      One row per ERC-20 Transfer event on Ethereum for contracts in the
      registry seed, with the asset label and a decimal-scaled amount.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [transaction_hash, log_index]
    columns:
      - name: asset_symbol
        description: Null means the contract is missing from seeds/token_contracts.csv.
        data_tests:
          - not_null
      - name: amount
        description: Token amount scaled by the contract's decimals. Null means the raw value failed to parse.
        data_tests:
          - not_null
      - name: transfer_type
        description: mint (from the zero address), burn (to the zero address) or transfer.
        data_tests:
          - accepted_values:
              arguments:
                values: [mint, burn, transfer]

  - name: stg_boc__fx_daily
    description: >
      One row per date and currency from the Bank of Canada daily rates, for
      the peg currencies in seeds/assets.csv plus USD. Series can stop or skip
      dates (RUB ends 2026-04-30); gaps are left for the marts to handle.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [rate_date, currency]
    columns:
      - name: currency
        description: Three-letter currency code taken from the Bank of Canada series_id.
        data_tests:
          - accepted_values:
              arguments:
                values: [EUR, SGD, BRL, RUB, USD]
      - name: cad_per_unit
        description: Canadian dollars per one unit of the currency.
        data_tests:
          - not_null

  - name: stg_defillama__chain_supply
    description: >
      One row per asset, chain and day of circulating supply from the latest
      DefiLlama snapshot, in the asset's own currency units. Assets DefiLlama
      doesn't list (BRZ, QCAD_LEGACY) have no rows. Days with no figure in the
      asset's own currency are dropped.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [asset_symbol, chain, supply_date]
    columns:
      - name: chain
        description: Chain name as DefiLlama writes it, such as Ethereum or World Chain.
      - name: circulating
        description: Circulating supply in the asset's peg currency. Null means the raw value failed to parse.
        data_tests:
          - not_null
